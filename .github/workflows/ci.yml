name: CI for SQL Helper

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Traer el código
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 4️⃣ Linter
      - name: Run ESLint
        run: npm run lint

      # 5️⃣ Compilación
      - name: Compile TypeScript
        run: npm run compile

      # 6️⃣ Tests con vscode-test
      - name: Run VS Code extension tests
        run: xvfb-run -a npm test

      # 7️⃣ Package VSIX
      - name: Package VSIX
        run: |
          npm install -g vsce
          npx vsce package

      # 8️⃣ Subir VSIX como artefacto
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v3
        with:
          name: sql-helper-vsix
          path: "*.vsix"
